<div class="snackbar-container" *ngIf="activeSnackbar$ | async as snack">
  <div class="snackbar-card" [ngClass]="snack.type">
    <div class="icon-box">
      <span class="material-icons icon" *ngIf="snack.type === 'success'">check_circle_outline</span>
      <span class="material-icons icon" *ngIf="snack.type === 'error'">error_outline</span>
      <span class="material-icons icon" *ngIf="snack.type === 'info'">info_outline</span>
      <span class="material-icons icon" *ngIf="snack.type === 'warning'">report_problem</span>
    </div>

    <div class="text-content">
      <div class="title" *ngIf="snack.title">{{ snack.title }}</div>
      <div class="message">{{ snack.message }}</div>
    </div>

    <button class="close-btn" (click)="close()" type="button" aria-label="Close">
      <span class="material-icons">close</span>
    </button>
  </div>
</div>

<div class="skl-auth-page">
    <div class="skl-auth-card">
        <div class="skl-auth-header">
            <div class="skl-logo-box">
                <span class="material-icons">key</span>
            </div>
            <h1>Reset Password</h1>
            <p>Enter the 6-digit OTP you received and set your new password.</p>
        </div>

        <form class="skl-auth-form" (ngSubmit)="onSubmit()">
            <div class="skl-field">
                <label for="identifier">Email or Mobile</label>
                <input id="identifier" type="text" [(ngModel)]="identifier" name="identifier"
                    placeholder="you@school.edu" required />
            </div>

            <div class="skl-field">
                <label for="otp">OTP Code</label>
                <input id="otp" type="text" [(ngModel)]="otp" name="otp" placeholder="123456" maxlength="6"
                    inputmode="numeric" autocomplete="one-time-code" required />
            </div>

            <div class="skl-field">
                <label for="newPassword">New Password</label>
                <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword"
                    placeholder="Min. 8 characters" autocomplete="new-password" required />
            </div>

            @if (error()) {
            <div class="skl-auth-error">
                <span class="material-icons">error_outline</span>
                {{ error() }}
            </div>
            }

            <button type="submit" class="skl-btn-primary" [disabled]="isLoading()">
                @if (isLoading()) { <span class="skl-spinner"></span>Resetting... } @else
                { Reset Password }
            </button>
        </form>

        <div class="skl-auth-footer">
            <a routerLink="/auth/forgot-password">← Resend OTP</a>
            &nbsp;·&nbsp;
            <a routerLink="/auth/login">Sign In</a>
        </div>
    </div>
</div>

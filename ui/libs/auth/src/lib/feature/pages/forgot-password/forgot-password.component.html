<div class="skl-auth-page">
    <div class="skl-auth-card">
        <div class="skl-auth-header">
            <div class="skl-logo-box">
                <span class="material-icons">lock_reset</span>
            </div>
            <h1>Forgot Password?</h1>
            <p>Enter your email or mobile. We'll send an OTP to reset your password.</p>
        </div>

        @if (!submitted()) {
        <form class="skl-auth-form" (ngSubmit)="onSubmit()">
            <div class="skl-field">
                <label for="identifier">Email or Mobile</label>
                <input id="identifier" type="text" [(ngModel)]="identifier" name="identifier"
                    placeholder="you@school.edu" required />
            </div>

            <button type="submit" class="skl-btn-primary" [disabled]="isLoading()">
                @if (isLoading()) { <span class="skl-spinner"></span>Sending OTP... }
                @else { Send OTP }
            </button>
        </form>
        } @else {
        <div class="skl-auth-success">
            <span class="material-icons">mark_email_read</span>
            <p>
                If an account with <strong>{{ identifier }}</strong> exists, an OTP has
                been sent.
            </p>
            <a routerLink="/auth/reset-password" class="skl-btn-primary">Enter OTP →</a>
        </div>
        }

        <div class="skl-auth-footer">
            <a routerLink="/auth/login">← Back to Sign In</a>
        </div>
    </div>
</div>

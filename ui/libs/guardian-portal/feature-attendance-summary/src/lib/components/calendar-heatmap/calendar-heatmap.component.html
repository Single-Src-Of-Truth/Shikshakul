<div class="calendar-card">
  <div class="cal-header">
    <h3>October 2023</h3>
    <div class="nav-arrows">
      <button class="icon-btn">
        <span class="material-icons">chevron_left</span>
      </button>
      <button class="icon-btn">
        <span class="material-icons">chevron_right</span>
      </button>
    </div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot green"></span> Present</div>
    <div class="item"><span class="dot red"></span> Absent</div>
    <div class="item"><span class="dot yellow"></span> Late/Half Day</div>
    <div class="item"><span class="dot gray"></span> Holiday</div>
  </div>

  <div class="cal-grid">
    <div class="day-name" *ngFor="let d of days">{{ d }}</div>

    <div
      class="date-cell"
      *ngFor="let date of calendarGrid"
      [ngClass]="[getStatusClass(date.status), date.isToday ? 'today' : '']"
    >
      <span class="day-num">{{ date.day }}</span>

      <span class="status-icon" *ngIf="date.status === 1"
        ><span class="material-icons">check</span></span
      >
      <span class="status-icon" *ngIf="date.status === 2"
        ><span class="material-icons">close</span></span
      >
      <span class="status-icon" *ngIf="date.status === 3"
        ><span class="material-icons">schedule</span></span
      >
      <span class="status-icon" *ngIf="date.status === 4"
        ><span class="material-icons">brightness_5</span></span
      >
    </div>
  </div>
</div>

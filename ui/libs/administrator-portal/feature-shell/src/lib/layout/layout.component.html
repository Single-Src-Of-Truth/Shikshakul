<div class="app-container">
  <shikshakul-sidenav [collapsed]="isSidebarCollapsed" (toggleCollapse)="toggleSidebar()">
  </shikshakul-sidenav>

  <main class="main-content">
    <header class="top-bar">
      <h2 class="page-title">Admin Dashboard</h2>

      <div class="search-bar">
        <span class="material-icons">search</span>
        <input type="text" placeholder="Search students, staff, or documents..." />
      </div>

      <div class="top-actions">
        <div class="date-badge" *ngIf="currentYear$ | async as yearRes">
          <span class="material-icons">calendar_today</span>
          <span>{{ yearRes.data.name }}</span>
        </div>
        <button class="icon-btn">
          <span class="material-icons">notifications</span>
          <span class="notification-dot"></span>
        </button>
      </div>
    </header>

    <div class="content-scrollable">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

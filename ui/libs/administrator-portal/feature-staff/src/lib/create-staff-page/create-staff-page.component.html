<div class="page-container">
  <header class="page-header">
    <div class="title-group">
      <div class="breadcrumbs">
        Home <span class="sep">/</span> Staff <span class="sep">/</span> Create
        New
      </div>
      <h1>Create Staff Profile</h1>
      <p class="subtitle">
        Add a new non-teaching staff member record to the system.
      </p>
    </div>
    <div class="action-buttons">
      <button class="btn-outline" (click)="onCancel()">Cancel</button>
      <button class="btn-primary" (click)="onSubmit()">
        <span class="material-icons">save</span> Save Record
      </button>
    </div>
  </header>

  <form [formGroup]="staffForm" class="form-layout">
    <div class="left-column">
      <div class="form-card">
        <shikshakul-staff-photo
          [parentForm]="staffForm"
        ></shikshakul-staff-photo>
      </div>

      <div class="form-card">
        <shikshakul-staff-personal-info
          [formGroup]="getGroup('personal')"
        ></shikshakul-staff-personal-info>
      </div>

      <div class="form-card">
        <shikshakul-staff-employment-info
          [formGroup]="getGroup('employment')"
        ></shikshakul-staff-employment-info>
      </div>
    </div>

    <div class="right-column">
      <div class="form-card">
        <shikshakul-staff-contact-details
          [formGroup]="getGroup('contact')"
        ></shikshakul-staff-contact-details>
      </div>

      <div class="form-card">
        <shikshakul-staff-banking-payroll
          [formGroup]="getGroup('banking')"
        ></shikshakul-staff-banking-payroll>
      </div>
    </div>
  </form>
</div>

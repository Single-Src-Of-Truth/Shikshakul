<div class="page-container" *ngIf="!loading && staff">
  <header class="profile-header">
    <div class="profile-main">
      <div class="avatar-lg">{{ staff.first_name.charAt(0) }}</div>
      <div class="text">
        <h1>{{ staff.first_name }} {{ staff.last_name }}</h1>
        <p>{{ staff.profile_data?.employment?.designation }}</p>

        <span
          class="status-badge"
          [class.pending]="staff.status === 'PENDING'"
          [class.approved]="staff.status === 'APPROVED'"
        >
          {{ staff.status || 'PENDING' }}
        </span>
      </div>
    </div>

    <div class="header-actions">
      <button
        class="btn-icon danger"
        (click)="deleteStaff()"
        title="Delete Staff"
      >
        <span class="material-icons">delete</span>
      </button>

      <button class="btn-outline" (click)="toggleEdit()">
        <span class="material-icons">{{ isEditing ? 'close' : 'edit' }}</span>
        {{ isEditing ? 'Cancel' : 'Edit Profile' }}
      </button>
    </div>
  </header>

  <div class="approval-bar" *ngIf="staff.status === 'PENDING'">
    <div class="info">
      <span class="material-icons">info</span>
      <span>This profile is pending approval.</span>
    </div>
    <div class="actions">
      <button class="btn-reject" (click)="updateStatus('REJECT')">
        Reject
      </button>
      <button class="btn-approve" (click)="updateStatus('APPROVE')">
        Approve Staff
      </button>
    </div>
  </div>
</div>

<div class="page-container">
  <header class="page-header">
    <div class="text-group">
      <div class="breadcrumbs">
        Home <span class="sep">/</span> Academics
        <span class="sep">/</span> Class Setup
      </div>
      <h1>Class & Section Management</h1>
      <p class="subtitle">
        Configure academic hierarchy for the current session (2023-2024)
      </p>
    </div>

    <button class="btn-primary" (click)="openCreateClassDialog()">
      <span class="material-icons">add</span>
      Add New Class
    </button>
  </header>

  <shikshakul-class-stats
    [totalClasses]="classes.length"
  ></shikshakul-class-stats>

  <div class="list-controls">
    <h3>All Classes</h3>
    <div class="actions">
      <button class="btn-outline">
        <span class="material-icons">filter_list</span> Filter
      </button>
      <button class="btn-outline">
        <span class="material-icons">sort</span> Sort
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="state-message">
    <span class="material-icons spin">sync</span> Loading classes...
  </div>

  <div *ngIf="!loading && classes.length === 0" class="state-message">
    No classes found. Click "Add New Class" to get started.
  </div>

  <div class="class-list" *ngIf="!loading && classes.length > 0">
    <shikshakul-class-list-item
      *ngFor="let cls of classes"
      [classData]="cls"
      (addSectionClick)="openSectionDialog(cls)"
      (manageSubjects)="openSubjectDialog(cls)"
      (removeSection)="onRemoveSection(cls, $event)"
      (edit)="onEditClass(cls)"
      (delete)="onDeleteClass(cls)"
    >
    </shikshakul-class-list-item>
  </div>

  <div class="pagination" *ngIf="!loading && classes.length > 0">
    <button class="page-btn">
      <span class="material-icons">chevron_left</span>
    </button>
    <button class="page-btn active">1</button>
    <button class="page-btn">2</button>
    <button class="page-btn">3</button>
    <button class="page-btn">
      <span class="material-icons">chevron_right</span>
    </button>
  </div>

  <shikshakul-class-dialog
    *ngIf="showClassDialog"
    [classData]="selectedClassData"
    [isEditMode]="isEditMode"
    (close)="closeClassDialog()"
    (save)="saveClass($event)"
  ></shikshakul-class-dialog>

  <shikshakul-section-dialog
    *ngIf="showSectionDialog && selectedClassForSection"
    [classId]="selectedClassForSection.id"
    [className]="selectedClassForSection.name"
    (close)="closeSectionDialog()"
    (save)="onSectionSaved()"
  ></shikshakul-section-dialog>

  <shikshakul-subject-allocation-dialog
    *ngIf="showSubjectDialog && selectedClassForSubjects"
    [classId]="selectedClassForSubjects.id"
    [className]="selectedClassForSubjects.name"
    (close)="closeSubjectDialog()"
    (save)="loadClasses()"
  ></shikshakul-subject-allocation-dialog>
</div>

<div class="skl-drawer-backdrop" *ngIf="subject" (click)="onCancel()" [class.open]="isOpen"></div>

<div class="skl-floating-drawer" [class.open]="isOpen">
  <div class="skl-drawer-header">
    <div class="skl-header-title-group">
      <h2 class="skl-drawer-title">{{ isEditMode ? 'Edit Subject' : 'Add New Subject' }}</h2>
      <p class="skl-drawer-subtitle">{{ isEditMode ? 'Update existing academic subject details.' : 'Create a new academic subject.' }}</p>
    </div>
    <div class="skl-drawer-actions">
      <button class="skl-icon-btn" (click)="resetForm(subjectForm)" title="Reset Form">
        <span class="material-icons">restart_alt</span>
      </button>
      <button class="skl-icon-btn" (click)="onCancel()" title="Close Drawer">
        <span class="material-icons">close</span>
      </button>
    </div>
  </div>

  <div class="skl-drawer-body">
    <form (ngSubmit)="onSubmit(subjectForm)" #subjectForm="ngForm">
      <div class="skl-form-group">
        <label>Subject Name</label>
        <input type="text" class="skl-input" [class.has-error]="name.invalid && (name.touched || isFormSubmitted)" [(ngModel)]="subject.name" name="name" #name="ngModel" placeholder="e.g. Mathematics" required autofocus />
        <span class="skl-error-text" *ngIf="name.invalid && (name.touched || isFormSubmitted)">Subject name is required.</span>
      </div>

      <div class="skl-form-group">
        <label>Subject Code</label>
        <input type="text" class="skl-input" [class.has-error]="code.invalid && (code.touched || isFormSubmitted)" [(ngModel)]="subject.code" name="code" #code="ngModel" placeholder="e.g. MATH-101" required />
        <span class="skl-error-text" *ngIf="code.invalid && (code.touched || isFormSubmitted)">Subject code is required.</span>
      </div>

      <div class="skl-form-group">
        <label>Type</label>
        <shikshakul-select
          [options]="subjectTypeOptions"
          [(ngModel)]="subject.type"
          name="type"
          placeholder="Select subject type">
        </shikshakul-select>
      </div>
    </form>
  </div>

  <div class="skl-drawer-footer">
    <button type="button" class="skl-btn-ghost" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
    <button type="button" class="skl-btn-primary" (click)="onSubmit(subjectForm)" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">{{ isEditMode ? 'Save Changes' : 'Create Subject' }}</span>
      <div class="skl-spinner" *ngIf="isSubmitting"></div>
    </button>
  </div>
</div>

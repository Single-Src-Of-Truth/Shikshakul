<!-- Backdrop -->
<div class="skl-drawer-backdrop" *ngIf="isOpen" (click)="onCancel()"></div>

<!-- Floating Slider Drawer -->
<div class="skl-floating-drawer" [class.open]="isOpen">
  <div class="skl-drawer-header">
    <h2 class="skl-drawer-title">{{ isEditMode ? 'Edit Class' : 'Add New Class' }}</h2>
    <div class="skl-drawer-actions">
      <button class="skl-icon-btn" (click)="resetForm()" title="Reset Form">
        <span class="material-icons">restart_alt</span>
      </button>
      <button class="skl-icon-btn" (click)="onCancel()" title="Close Drawer">
        <span class="material-icons">close</span>
      </button>
    </div>
  </div>

  <div class="skl-drawer-body">
    <form [formGroup]="classForm" class="skl-drawer-form">
      <div class="skl-form-group">
        <label class="skl-label" for="className">Class Name</label>
        <input type="text" id="className" formControlName="name" class="skl-input" placeholder="e.g. Class 10"
          [class.has-error]="classForm.get('name')?.invalid && classForm.get('name')?.touched" autofocus />
        <div class="skl-error-text" *ngIf="classForm.get('name')?.touched && classForm.get('name')?.invalid">
          Class name is required.
        </div>
      </div>

      <div class="skl-form-group">
        <label class="skl-label" for="sortOrder">Sort Order</label>
        <input type="number" id="sortOrder" formControlName="sort_order" class="skl-input" placeholder="e.g. 10"
          [class.has-error]="classForm.get('sort_order')?.invalid && classForm.get('sort_order')?.touched" />
        <span class="skl-helper"
          *ngIf="!(classForm.get('sort_order')?.invalid && classForm.get('sort_order')?.touched)">Higher numbers appear
          lower in the list.</span>
        <div class="skl-error-text" *ngIf="classForm.get('sort_order')?.touched && classForm.get('sort_order')?.invalid">
          Valid sort order is required.
        </div>
      </div>
    </form>
  </div>

  <div class="skl-drawer-footer">
    <button type="button" class="skl-btn-primary" (click)="onSubmit()" [disabled]="submitting">
      <span *ngIf="!submitting">{{ isEditMode ? 'Update Class' : 'Create Class' }}</span>
      <div class="skl-spinner skl-sm" *ngIf="submitting"></div>
    </button>
  </div>
</div>

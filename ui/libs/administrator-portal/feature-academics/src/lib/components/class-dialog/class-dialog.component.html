<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Edit Class' : 'Add New Class' }}</h2>
      <button class="close-btn" (click)="onCancel()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="className">Class Name</label>
        <input
          type="text"
          id="className"
          [(ngModel)]="classData.name"
          name="name"
          placeholder="e.g. Class 10"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="sortOrder">Sort Order</label>
        <input
          type="number"
          id="sortOrder"
          [(ngModel)]="classData.sort_order"
          name="sort_order"
          placeholder="e.g. 10"
          required
        />
        <small class="hint">Higher numbers appear lower in the list.</small>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-text" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn-primary">
          {{ isEditMode ? 'Update' : 'Create Class' }}
        </button>
      </div>
    </form>
  </div>
</div>

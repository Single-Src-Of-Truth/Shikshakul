<!-- Backdrop -->
<div class="skl-drawer-backdrop" *ngIf="isOpen" (click)="onCancel()"></div>

<!-- Floating Slider Drawer -->
<div class="skl-floating-drawer" [class.open]="isOpen">
    <div class="skl-drawer-header">
        <div class="skl-header-title-group">
            <h2 class="skl-drawer-title">Add Section</h2>
            <p class="skl-drawer-subtitle">For {{ className }}</p>
        </div>
        <div class="skl-drawer-actions">
            <button class="skl-icon-btn" (click)="resetForm()" title="Reset Form">
                <span class="material-icons">restart_alt</span>
            </button>
            <button class="skl-icon-btn" (click)="onCancel()" title="Close Drawer">
                <span class="material-icons">close</span>
            </button>
        </div>
    </div>

    <div class="skl-drawer-body">
        <form [formGroup]="sectionForm" class="skl-drawer-form">
            <div class="skl-form-group">
                <label class="skl-label" for="secName">Section Name</label>
                <input type="text" id="secName" formControlName="name" class="skl-input" placeholder="e.g. Section A"
                    [class.has-error]="sectionForm.get('name')?.invalid && sectionForm.get('name')?.touched"
                    autofocus />
                <div class="skl-error-text" *ngIf="sectionForm.get('name')?.touched && sectionForm.get('name')?.invalid">
                    Section name is required.
                </div>
            </div>

            <div class="skl-form-group">
                <label class="skl-label" for="capacity">Student Capacity</label>
                <input type="number" id="capacity" formControlName="capacity" class="skl-input" placeholder="e.g. 40"
                    [class.has-error]="sectionForm.get('capacity')?.invalid && sectionForm.get('capacity')?.touched" />
                <span class="skl-helper"
                    *ngIf="!(sectionForm.get('capacity')?.invalid && sectionForm.get('capacity')?.touched)">Maximum
                    number of students allowed.</span>
                <div class="skl-error-text"
                    *ngIf="sectionForm.get('capacity')?.touched && sectionForm.get('capacity')?.invalid">
                    Valid capacity is required.
                </div>
            </div>
        </form>
    </div>

    <div class="skl-drawer-footer">
        <button type="button" class="skl-btn-primary" (click)="onSubmit()" [disabled]="submitting">
            <span *ngIf="!submitting">Create Section</span>
            <div class="skl-spinner skl-sm" *ngIf="submitting"></div>
        </button>
    </div>
</div>

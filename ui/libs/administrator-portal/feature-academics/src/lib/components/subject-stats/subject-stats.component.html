<div class="stats-grid">
  <div class="stat-card">
    <div class="top-row">
      <div class="icon-box blue">
        <span class="material-icons">library_books</span>
      </div>
      <span class="badge positive">+2 this week</span>
    </div>
    <div class="info">
      <span class="label">Total Subjects</span>
      <span class="value">{{ total }}</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="top-row">
      <div class="icon-box orange">
        <span class="material-icons">menu_book</span>
      </div>
    </div>
    <div class="info">
      <span class="label">Theory Subjects</span>
      <span class="value">{{ theory }}</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="top-row">
      <div class="icon-box purple">
        <span class="material-icons">science</span>
      </div>
    </div>
    <div class="info">
      <span class="label">Practical / Labs</span>
      <span class="value">{{ practical }}</span>
    </div>
  </div>

  <div class="stat-card">
    <div class="top-row">
      <div class="icon-box teal"><span class="material-icons">brush</span></div>
    </div>
    <div class="info">
      <span class="label">Co-Scholastic</span>
      <span class="value">{{ other }}</span>
    </div>
  </div>
</div>

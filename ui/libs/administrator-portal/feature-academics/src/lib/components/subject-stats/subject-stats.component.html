<div class="skl-stats-grid">
  <div class="skl-stat-card skl-total">
    <div class="skl-stat-icon-box">
      <span class="material-icons">auto_stories</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Total Subjects</span>
      <span class="skl-stat-value">{{ total }}</span>
    </div>
  </div>

  <div class="skl-stat-card skl-theory">
    <div class="skl-stat-icon-box">
      <span class="material-icons">menu_book</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Theory Subjects</span>
      <span class="skl-stat-value">{{ theory }}</span>
    </div>
  </div>

  <div class="skl-stat-card skl-practical">
    <div class="skl-stat-icon-box">
      <span class="material-icons">biotech</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Practical / Lab</span>
      <span class="skl-stat-value">{{ practical }}</span>
    </div>
  </div>

  <div class="skl-stat-card skl-other">
    <div class="skl-stat-icon-box">
      <span class="material-icons">brush</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Co-Scholastic</span>
      <span class="skl-stat-value">{{ other }}</span>
    </div>
  </div>
</div>

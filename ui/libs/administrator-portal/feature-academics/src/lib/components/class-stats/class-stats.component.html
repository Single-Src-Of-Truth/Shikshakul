<div class="skl-stats-grid">
  <div class="skl-ay-stat-card skl-active">
    <div class="skl-ay-icon-box">
      <span class="material-icons">class</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">TOTAL CLASSES</span>
      <span class="skl-stat-value">{{ totalClasses }}</span>
    </div>
  </div>

  <div class="skl-ay-stat-card skl-upcoming">
    <div class="skl-ay-icon-box">
      <span class="material-icons">grid_view</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">TOTAL SECTIONS</span>
      <span class="skl-stat-value">{{ totalSections }}</span>
    </div>
  </div>

  <div class="skl-ay-stat-card skl-archived">
    <div class="skl-ay-icon-box">
      <span class="material-icons">groups</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">STUDENTS ENROLLED</span>
      <span class="skl-stat-value">{{ totalStudents }}</span>
    </div>
  </div>
</div>

<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Edit Subject' : 'Add New Subject' }}</h2>
      <button class="close-btn" (click)="onCancel()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Subject Name</label>
        <input
          type="text"
          [(ngModel)]="subject.name"
          name="name"
          placeholder="e.g. Mathematics"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label>Subject Code</label>
        <input
          type="text"
          [(ngModel)]="subject.code"
          name="code"
          placeholder="e.g. MATH-101"
          required
        />
      </div>

      <div class="form-group">
        <label>Type</label>
        <select [(ngModel)]="subject.type" name="type">
          <option value="THEORY">Theory</option>
          <option value="PRACTICAL">Practical</option>
          <option value="CO_SCHOLASTIC">Co-Scholastic</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-text" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>

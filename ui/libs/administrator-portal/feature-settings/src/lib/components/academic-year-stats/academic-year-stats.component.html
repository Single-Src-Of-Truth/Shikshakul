<div class="skl-stats-grid">
  <div class="skl-ay-stat-card skl-active">
    <div class="skl-ay-icon-box">
      <span class="material-icons">event_available</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Active Session</span>
      <span class="skl-stat-value">{{ activeYearName }}</span>
    </div>
  </div>

  <div class="skl-ay-stat-card skl-upcoming">
    <div class="skl-ay-icon-box">
      <span class="material-icons">calendar_month</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Upcoming Session</span>
      <span class="skl-stat-value">{{ upcomingYearName }}</span>
    </div>
  </div>

  <div class="skl-ay-stat-card skl-archived">
    <div class="skl-ay-icon-box">
      <span class="material-icons">inventory_2</span>
    </div>
    <div class="skl-stat-content">
      <span class="skl-stat-label">Archived Sessions</span>
      <span class="skl-stat-value">{{ archivedCount }}</span>
    </div>
  </div>
</div>

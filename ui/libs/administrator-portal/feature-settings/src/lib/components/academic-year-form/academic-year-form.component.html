<!-- Backdrop -->
<div class="skl-drawer-backdrop" *ngIf="isOpen" (click)="close()"></div>

<!-- Floating Slider Drawer -->
<div class="skl-floating-drawer" [class.open]="isOpen">
    <div class="skl-drawer-header">
        <h2 class="skl-drawer-title">Add Academic Year</h2>
        <div class="skl-drawer-actions">
            <button class="skl-icon-btn" (click)="resetForm()" title="Reset Form">
                <span class="material-icons">restart_alt</span>
            </button>
            <button class="skl-icon-btn" (click)="close()" title="Close Drawer">
                <span class="material-icons">close</span>
            </button>
        </div>
    </div>

    <div class="skl-drawer-body">
        <form [formGroup]="yearForm" class="skl-drawer-form">
            <div class="skl-form-group">
                <label class="skl-label">Academic Year Name</label>
                <input type="text" formControlName="name" class="skl-input" [placeholder]="'e.g. ' + dynamicYearExample"
                    [class.has-error]="yearForm.get('name')?.invalid && yearForm.get('name')?.touched">
                <span class="skl-helper" *ngIf="!(yearForm.get('name')?.invalid && yearForm.get('name')?.touched)">
                    Standard format: YYYY-YYYY
                </span>
                <div class="skl-error-text" *ngIf="yearForm.get('name')?.touched && yearForm.get('name')?.invalid">
                    Please enter a valid format (e.g., {{ dynamicYearExample }}).
                </div>
            </div>

            <div class="skl-form-group">
                <label class="skl-label">Start Date</label>
                <shikshakul-datepicker formControlName="start_date" placeholder="Select start date"
                    [hasError]="!!(yearForm.get('start_date')?.invalid && yearForm.get('start_date')?.touched)">
                </shikshakul-datepicker>
                <div class="skl-error-text" *ngIf="yearForm.get('start_date')?.touched && yearForm.get('start_date')?.invalid">
                    Start date is required.
                </div>
            </div>
            <div class="skl-form-group">
                <label class="skl-label">End Date</label>
                <shikshakul-datepicker formControlName="end_date" placeholder="Select end date"
                    [hasError]="!!(yearForm.get('end_date')?.invalid && yearForm.get('end_date')?.touched)">
                </shikshakul-datepicker>
                <div class="skl-error-text" *ngIf="yearForm.get('end_date')?.touched && yearForm.get('end_date')?.invalid">
                    End date is required.
                </div>
            </div>
        </form>
    </div>

    <div class="skl-drawer-footer">
        <button type="button" class="skl-btn-primary" (click)="onSubmit()" [disabled]="submitting">
            <span *ngIf="!submitting">Create Academic Year</span>
            <div class="skl-spinner skl-sm" *ngIf="submitting"></div>
        </button>
    </div>
</div>

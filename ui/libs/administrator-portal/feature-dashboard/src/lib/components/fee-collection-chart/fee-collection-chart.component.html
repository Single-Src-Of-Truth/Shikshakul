<div class="chart-wrapper">
  <div class="header-row">
    <div class="title-group">
      <h3>Fee Collection</h3>
      <span class="subtitle">Current Quarter (Q2)</span>
    </div>
    <div class="stats-group">
      <h2 class="amount">₹ 45.2 L</h2>
      <span class="meta">Collected this month</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas
      baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType"
    >
    </canvas>
  </div>
</div>

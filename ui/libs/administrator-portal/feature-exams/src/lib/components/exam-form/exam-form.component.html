<div class="form-card" [formGroup]="examForm">
  <div class="card-header">
    <div class="title">
      <h3>Schedule Examination</h3>
      <p class="subtitle">Assign exam dates and marks for subjects per term.</p>
    </div>
    <span class="badge-blue">Step 1: Term & Class</span>
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label>Exam Term <span class="required">*</span></label>
      <select formControlName="exam_term_id">
        <option value="">Select Term</option>
        <option *ngFor="let term of terms" [value]="term.id">{{ term.name }}</option>
      </select>
    </div>
    <div class="form-field">
      <label>Class / Grade <span class="required">*</span></label>
      <select formControlName="class_id">
        <option value="">Select Class</option>
        <option *ngFor="let c of classes()" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>
  </div>

  <hr class="divider" />

  <div class="subjects-section">
    <div class="section-header">
      <div class="text">
        <h4>Subject Schedules</h4>
        <p>Define dates, times, and marks for each subject.</p>
      </div>
      <button class="add-btn" (click)="addSubject()">
        <span class="material-icons">add_circle_outline</span> Add Subject Slot
      </button>
    </div>

    <div class="subjects-list">
      <div class="list-header">
        <span class="col-subject">SUBJECT</span>
        <span class="col-date">DATE</span>
        <span class="col-time">TIME (S-E)</span>
        <span class="col-marks">MAX/PASS</span>
        <span class="col-room">ROOM</span>
        <span class="col-action"></span>
      </div>

      <div
        class="list-row"
        *ngFor="let schedule of schedulesArray.controls; let i = index"
        [formGroup]="$any(schedule)"
      >
        <div class="col-subject">
          <select formControlName="subject_id">
            <option value="">Select...</option>
            <option *ngFor="let s of subjects()" [value]="s.id">{{ s.name }}</option>
          </select>
        </div>
        <div class="col-date">
          <input type="date" formControlName="exam_date" />
        </div>
        <div class="col-time">
          <div class="time-range">
            <input type="time" formControlName="start_time" />
            <span>-</span>
            <input type="time" formControlName="end_time" />
          </div>
        </div>
        <div class="col-marks">
          <div class="marks-input">
            <input type="number" formControlName="max_marks" placeholder="Max" />
            <input type="number" formControlName="pass_marks" placeholder="Pass" />
          </div>
        </div>
        <div class="col-room">
          <input type="text" formControlName="room_number" placeholder="Room" />
        </div>
        <div class="col-action">
          <button class="delete-btn" (click)="removeSubject(i)">
            <span class="material-icons">delete_outline</span>
          </button>
        </div>
      </div>

      <div *ngIf="schedulesArray.length === 0" class="empty-list">
        <span class="material-icons">event_note</span>
        <p>No subjects added to schedule yet. Click "Add Subject Slot" to start.</p>
      </div>
    </div>
  </div>

  <div class="form-footer">
    <button class="btn-ghost" (click)="examForm.reset()">Clear Form</button>
    <button class="btn-primary" (click)="onSubmit()" [disabled]="submitting()">
      <span class="material-icons" *ngIf="!submitting()">publish</span>
      <span class="material-icons spin" *ngIf="submitting()">refresh</span>
      {{ submitting() ? 'Scheduling...' : 'Publish Exam Schedule' }}
    </button>
  </div>
</div>

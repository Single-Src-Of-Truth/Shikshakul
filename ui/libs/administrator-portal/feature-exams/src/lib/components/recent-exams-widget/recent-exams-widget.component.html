<div class="widget-card">
  <div class="widget-header">
    <div class="title-env">
      <span class="material-icons">assignment</span>
      <h4>Exam Terms</h4>
    </div>
    <button class="add-mini-btn" (click)="toggleForm()">
      <span class="material-icons">{{ showForm() ? 'close' : 'add' }}</span>
    </button>
  </div>

  <div class="widget-content">
    <!-- Inline Create Term Form -->
    <div class="inline-form" *ngIf="showForm()" [formGroup]="termForm">
      <h5>Create New Term</h5>
      <div class="field">
        <label>Term Name</label>
        <input type="text" formControlName="name" placeholder="e.g., Term 1" />
      </div>
      <div class="row-fields">
        <div class="field">
          <label>Start Date</label>
          <input type="date" formControlName="start_date" />
        </div>
        <div class="field">
          <label>End Date</label>
          <input type="date" formControlName="end_date" />
        </div>
      </div>
      <button class="btn-submit" (click)="onSubmit()" [disabled]="submitting() || termForm.invalid">
        {{ submitting() ? 'Saving...' : 'Save Term' }}
      </button>
    </div>

    <!-- Terms List -->
    <div class="terms-list" *ngIf="!loading">
      <div class="term-item" *ngFor="let term of terms">
        <div class="term-info">
          <p class="name">{{ term.name }}</p>
          <p class="dates">{{ term.start_date | date:'mediumDate' }} - {{ term.end_date | date:'mediumDate' }}</p>
        </div>
        <div class="status-badge" [ngClass]="term.is_published ? 'published' : 'pending'">
          {{ term.is_published ? 'PUBLISHED' : 'DRAFT' }}
        </div>
      </div>

      <div class="empty-state" *ngIf="terms.length === 0">
        <span class="material-icons">info_outline</span>
        <p>No exam terms defined yet.</p>
      </div>
    </div>

    <div class="loading-state" *ngIf="loading">
      <span class="material-icons spin">refresh</span>
      <p>Loading terms...</p>
    </div>
  </div>
</div>

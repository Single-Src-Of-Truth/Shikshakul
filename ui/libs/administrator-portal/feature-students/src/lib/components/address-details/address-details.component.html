<div class="form-card" [formGroup]="formGroup">
  <div class="card-header">
    <h3 class="card-title">Residential Address</h3>
    <span class="material-icons header-icon">home</span>
  </div>

  <div class="form-grid">
    <div class="form-field full-width">
      <label>Address Line 1 <span class="required">*</span></label>
      <input
        type="text"
        formControlName="addressLine1"
        placeholder="House No., Street Name"
        [class.invalid]="
          formGroup.get('addressLine1')?.invalid &&
          formGroup.get('addressLine1')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>City <span class="required">*</span></label>
      <input
        type="text"
        formControlName="city"
        placeholder="City"
        [class.invalid]="
          formGroup.get('city')?.invalid && formGroup.get('city')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>State <span class="required">*</span></label>
      <select
        formControlName="state"
        [class.invalid]="
          formGroup.get('state')?.invalid && formGroup.get('state')?.touched
        "
      >
        <option value="" disabled selected>Select State</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Delhi">Delhi</option>
      </select>
    </div>

    <div class="form-field">
      <label>Pincode <span class="required">*</span></label>
      <input
        type="text"
        formControlName="pincode"
        placeholder="110001"
        [class.invalid]="
          formGroup.get('pincode')?.invalid && formGroup.get('pincode')?.touched
        "
      />
    </div>
  </div>
</div>

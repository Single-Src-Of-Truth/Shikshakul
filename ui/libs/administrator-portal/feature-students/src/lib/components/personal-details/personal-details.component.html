<div class="form-card" [formGroup]="formGroup">
  <div class="card-header">
    <h3 class="card-title">Personal Information</h3>
    <span class="material-icons header-icon">person</span>
  </div>

  <div class="form-grid">
    <div class="form-field">
      <label>First Name <span class="required">*</span></label>
      <input
        type="text"
        formControlName="firstName"
        placeholder="e.g. Rahul"
        [class.invalid]="
          formGroup.get('firstName')?.invalid &&
          formGroup.get('firstName')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>Last Name <span class="required">*</span></label>
      <input
        type="text"
        formControlName="lastName"
        placeholder="e.g. Sharma"
        [class.invalid]="
          formGroup.get('lastName')?.invalid &&
          formGroup.get('lastName')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>Date of Birth <span class="required">*</span></label>
      <input
        type="date"
        formControlName="dob"
        [class.invalid]="
          formGroup.get('dob')?.invalid && formGroup.get('dob')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>Gender <span class="required">*</span></label>
      <select
        formControlName="gender"
        [class.invalid]="
          formGroup.get('gender')?.invalid && formGroup.get('gender')?.touched
        "
      >
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-field">
      <label>Blood Group</label>
      <select formControlName="bloodGroup">
        <option value="" disabled selected>Select Group</option>
        <option value="A+">A+</option>
        <option value="B+">B+</option>
      </select>
    </div>

    <div class="form-field">
      <label>Category</label>
      <select formControlName="category">
        <option value="General">General</option>
        <option value="OBC">OBC</option>
        <option value="SC/ST">SC/ST</option>
      </select>
    </div>

    <div class="form-field full-width">
      <label>Aadhar Card Number</label>
      <input
        type="text"
        formControlName="aadharNumber"
        placeholder="XXXX XXXX XXXX"
      />
    </div>
  </div>
</div>

<div class="form-card" [formGroup]="formGroup">
  <div class="card-header">
    <h3 class="card-title">Admission Details</h3>
  </div>

  <div class="form-grid single-col">
    <div class="form-field">
      <label>Admission Number <span class="required">*</span></label>
      <div class="input-with-icon">
        <input
          type="text"
          formControlName="admissionNumber"
          readonly
          class="readonly-input"
        />
        <span class="material-icons lock-icon">lock</span>
      </div>
    </div>

    <div class="form-field">
      <label>Date of Admission <span class="required">*</span></label>
      <input
        type="date"
        formControlName="dateOfAdmission"
        [class.invalid]="
          formGroup.get('dateOfAdmission')?.invalid &&
          formGroup.get('dateOfAdmission')?.touched
        "
      />
    </div>

    <div class="form-field">
      <label>Academic Year</label>
      <select formControlName="academicYear">
        <option value="2024-2025">2024-2025</option>
        <option value="2025-2026">2025-2026</option>
      </select>
    </div>
  </div>
</div>

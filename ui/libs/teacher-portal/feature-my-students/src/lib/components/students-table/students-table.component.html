<div class="table-card">
  <div class="table-header">
    <div class="col-roll">ROLL NO</div>
    <div class="col-name">STUDENT NAME</div>
    <div class="col-gender">GENDER</div>
    <div class="col-status">STATUS</div>
    <div class="col-action">ACTION</div>
  </div>

  <div class="table-row" *ngFor="let s of students">
    <div class="col-roll">{{ s.rollNo }}</div>

    <div class="col-name">
      <div class="avatar" [ngClass]="s.avatarClass">
        <span *ngIf="!s.avatarUrl">{{ s.initials }}</span>
        <img *ngIf="s.avatarUrl" [src]="s.avatarUrl" alt="Student" />
      </div>
      <span class="name">{{ s.name }}</span>
    </div>

    <div class="col-gender">{{ s.gender }}</div>

    <div class="col-status">
      <span class="status-badge" [ngClass]="s.statusClass">
        {{ s.status }}
        <span class="sub" *ngIf="s.statusSub">{{ s.statusSub }}</span>
      </span>
    </div>

    <div class="col-action">
      <a [routerLink]="['/student', s.id]" class="view-link">
        View Profile <span class="material-icons">arrow_forward</span>
      </a>
    </div>
  </div>

  <div class="pagination">
    <span class="text">Showing 1 to {{ students.length }} of 42 students</span>
    <div class="pages">
      <button class="page-btn disabled">Previous</button>
      <button class="page-btn">Next</button>
    </div>
  </div>
</div>

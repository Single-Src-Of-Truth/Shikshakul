server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:;" always;

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # URL: apps.shikshakul.com/admin
    location ^~ /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # URL: apps.shikshakul.com/teacher
    location ^~ /teacher {
        alias /usr/share/nginx/html/teacher;
        try_files $uri $uri/ /teacher/index.html;
    }

    # URL: apps.shikshakul.com/parent
    location ^~ /parent {
        alias /usr/share/nginx/html/guardian;
        try_files $uri $uri/ /parent/index.html;
    }

    # --- Health Check ---
    location /health {
        return 200 "Frontend is UP";
        add_header Content-Type text/plain;
    }

    # --- CATCH-ALL REDIRECT ---
    # Matches "/" and any other path not defined above (e.g., /xyz, /login)
    location / {
        # 302 = Temporary Redirect (Better than 301 if you plan to add a Landing Page later)
        # 301 = Permanent Redirect (Browsers cache this forever)
        return 302 /admin;
    }
}

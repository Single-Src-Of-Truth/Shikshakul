upstream iam_service {
    server host.containers.internal:9000;
}

upstream academics_service {
    server host.containers.internal:9001;
}

upstream utility_service {
    server host.containers.internal:9004;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:;" always;

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- API Proxy: IAM Service ---
    location /api/iam/ {
        proxy_pass http://iam_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # --- API Proxy: Academics Service ---
    location /api/v1/ {
        proxy_pass http://academics_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # --- API Proxy: Utility Service (documents/files) ---
    location /api/docs/ {
        proxy_pass http://utility_service/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # URL: apps.shikshakul.com/admin
    location ^~ /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # URL: apps.shikshakul.com/teacher
    location ^~ /teacher {
        alias /usr/share/nginx/html/teacher;
        try_files $uri $uri/ /teacher/index.html;
    }

    # URL: apps.shikshakul.com/parent
    location ^~ /parent {
        alias /usr/share/nginx/html/guardian;
        try_files $uri $uri/ /parent/index.html;
    }

    # --- Health Check ---
    location /health {
        return 200 "Frontend is UP";
        add_header Content-Type text/plain;
    }

    # --- CATCH-ALL REDIRECT ---
    location / {
        return 302 /admin;
    }
}

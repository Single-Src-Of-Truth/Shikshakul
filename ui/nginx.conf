upstream iam_service {
    server host.containers.internal:9000;
}

upstream academics_service {
    server host.containers.internal:9001;
}

upstream utility_service {
    server host.containers.internal:9004;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com;" always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- API Proxy: IAM Service ---
    location /api/iam/ {
        proxy_pass          http://iam_service/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_redirect      http:// https://;
        proxy_cookie_flags  skl_session samesite=strict;
        proxy_read_timeout  60s;
    }

    # --- API Proxy: Academics Service (session-protected) ---
    location /api/v1/ {
        auth_request        /_auth/verify;

        auth_request_set    $skl_user_id    $upstream_http_skl_user_id;
        auth_request_set    $skl_tenant_id  $upstream_http_skl_tenant_id;
        auth_request_set    $skl_perms      $upstream_http_skl_permissions;

        proxy_set_header    Skl-User-Id     $skl_user_id;
        proxy_set_header    Skl-Tenant-Id   $skl_tenant_id;
        proxy_set_header    Skl-Permissions $skl_perms;

        proxy_pass          http://academics_service/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_redirect      http:// https://;
        proxy_read_timeout  60s;
    }

    location = /_auth/verify {
        internal;
        proxy_pass              http://iam_service/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length  "";
        proxy_set_header        Host            $host;
        proxy_set_header        Cookie          $http_cookie;
        proxy_set_header        User-Agent      $http_user_agent;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Real-IP       $remote_addr;
    }

    # --- API Proxy: Utility Service ---
    location /api/docs/ {
        proxy_pass          http://utility_service/docs/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_redirect      http:// https://;
        proxy_read_timeout  60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Frontend Apps ---
    location ^~ /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /teacher {
        alias /usr/share/nginx/html/teacher;
        try_files $uri $uri/ /teacher/index.html;
    }

    location ^~ /parent {
        alias /usr/share/nginx/html/guardian;
        try_files $uri $uri/ /parent/index.html;
    }

    location /health {
        return 200 "Frontend is UP";
        add_header Content-Type text/plain;
    }

    location / {
        return 302 /admin;
    }
}

name: Academics Service Deployment (eng)

on:
    push:
        branches: ["beta"]
        paths:
            - "eng/academics-service/**"
            - ".github/workflows/eng-academics-cd.yml"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.generate_tag.outputs.TAG }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Generate Image Tag
              id: generate_tag
              run: |
                  # Format: YYYY-MM-DD-HH-MM-SS-<5-digit-sha>-staging
                  TIMESTAMP=$(date +'%Y-%m-%d-%H-%M-%S')
                  SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-5)
                  TAG="${TIMESTAMP}-${SHORT_SHA}-staging"

                  echo "TAG=$TAG" >> $GITHUB_OUTPUT
                  echo "Generated Tag: $TAG"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./eng/academics-service
                  file: ./eng/academics-service/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/academics-service:${{ steps.generate_tag.outputs.TAG }}
                      ${{ secrets.DOCKER_USERNAME }}/academics-service:beta

    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  envs: IMAGE_TAG
                  script: |
                      IMAGE_URI="docker.io/${{ secrets.DOCKER_USERNAME }}/academics-service:$IMAGE_TAG"

                      # 1. Pre-deployment Cleanup (Removes any dangling partial downloads)
                      podman image prune -f

                      # 2. Pull the specific new image before stopping the old one
                      echo "Pulling $IMAGE_URI..."
                      podman pull $IMAGE_URI

                      # 3. Graceful Shutdown (Wait up to 15s for active DB transactions/requests to finish)
                      echo "Gracefully stopping current service..."
                      podman stop --time 15 academics-service || true
                      podman rm academics-service || true

                      # 4. Start the new container
                      echo "Starting new container..."
                      podman run -d \
                        --name academics-service \
                        --restart on-failure \
                        -p 9001:9001 \
                        -e PORT=9001 \
                        -e ENVIRONMENT=staging \
                        -e AUTO_MIGRATE=false \
                        -e DATABASE_URL='${{ secrets.DB_URL }}' \
                        -e REDIS_URL='${{ secrets.REDIS_URL }}' \
                        -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
                        $IMAGE_URI

                      # 5. Readiness Probe
                      echo "Waiting 5 seconds for initialization..."
                      sleep 5

                      # Health check on port 9001
                      if curl -f http://localhost:9001/health; then
                          echo "Deployment Successful: Health check passed!"

                          # 6. Deep Cleanup (Only runs if successful to free up disk space)
                          echo "Running disk cleanup to remove the old image..."
                          podman image prune -a -f
                      else
                          echo "Deployment Failed: Health check failed!"
                          podman logs academics-service
                          exit 1
                      fi

name: Academics Service Deployment

on:
    push:
        branches: ["beta"]
        paths:
            - "eng/academics-service/**"
            - ".github/workflows/backend-cd.yml"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./eng/academics-service
                  file: ./eng/academics-service/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/academics-service:beta

    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # 1. Pull the new image
                      podman pull docker.io/${{ secrets.DOCKER_USERNAME }}/academics-service:beta

                      # 2. Stop and remove existing container (if running)
                      podman stop academics-service || true
                      podman rm academics-service || true

                      # 3. Run the new container
                      podman run -d \
                        --name academics-service \
                        --restart on-failure \
                        -p 9001:9001 \
                        -e PORT=9001 \
                        -e ENVIRONMENT=staging \
                        -e AUTO_MIGRATE=false \
                        -e DATABASE_URL='${{ secrets.DB_URL }}' \
                        -e REDIS_URL='${{ secrets.REDIS_URL }}' \
                        -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
                        docker.io/${{ secrets.DOCKER_USERNAME }}/academics-service:beta

                      # 4. HEALTH CHECK
                      # Wait 5 seconds for the app to initialize
                      echo "Waiting for service to start..."
                      sleep 5

                      # Curl the health endpoint. If it fails, the script exits with error.
                      if curl -f http://localhost:9001/health; then
                          echo "Deployment Successful: Health check passed"
                      else
                          echo "Deployment Failed: Health check failed"
                          # Print logs to see why it crashed
                          podman logs academics-service
                          exit 1
                      fi

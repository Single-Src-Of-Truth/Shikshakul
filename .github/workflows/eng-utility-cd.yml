name: Utility Service Deployment (eng)
on:
    workflow_dispatch:
    push:
        branches: ["beta"]
        paths:
            - "eng/utility-service/**"
            - "lib/core-go/**"
            - ".github/workflows/eng-utility-cd.yml"
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.generate_tag.outputs.TAG }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Generate Image Tag
              id: generate_tag
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d-%H-%M-%S')
                  SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-5)
                  TAG="${TIMESTAMP}-${SHORT_SHA}-staging"
                  echo "TAG=$TAG" >> $GITHUB_OUTPUT
                  echo "Generated Tag: $TAG"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./eng/utility-service/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/utility-service:${{ steps.generate_tag.outputs.TAG }}
                      ${{ secrets.DOCKER_USERNAME }}/utility-service:beta
    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  envs: IMAGE_TAG
                  script: |
                      IMAGE_URI="docker.io/${{ secrets.DOCKER_USERNAME }}/utility-service:$IMAGE_TAG"
                      podman image prune -f
                      echo "Pulling $IMAGE_URI..."
                      podman pull $IMAGE_URI
                      echo "Gracefully stopping current service..."
                      podman stop --time 15 utility-service || true
                      podman rm utility-service || true
                      echo "Starting new container..."
                      loginctl enable-linger ubuntu
                      podman run -d \
                        --name utility-service \
                        --restart always \
                        -p 9004:9004 \
                        -e PORT=9004 \
                        -e ENVIRONMENT=staging \
                        -e REDIS_URL='${{ secrets.REDIS_URL }}' \
                        -e AWS_REGION='${{ secrets.AWS_REGION }}' \
                        -e DOC_BUCKET_NAME='${{ secrets.DOC_BUCKET_NAME }}' \
                        -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
                        -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
                        $IMAGE_URI
                      echo "Waiting 5 seconds for initialization..."
                      sleep 5
                      if curl -f http://localhost:9004/ping; then
                          echo "Deployment Successful: Health check passed!"
                          echo "Running disk cleanup..."
                          podman image prune -a -f
                      else
                          echo "Deployment Failed: Health check failed!"
                          podman logs utility-service
                          exit 1
                      fi

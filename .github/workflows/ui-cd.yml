name: UI Deployment (ui)
on:
    workflow_dispatch:
    push:
        branches: ["beta"]
        paths:
            - "ui/**"
            - ".github/workflows/ui-cd.yml"
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.generate_tag.outputs.TAG }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Generate Image Tag
              id: generate_tag
              run: |
                  TIMESTAMP=$(date +'%Y-%m-%d-%H-%M-%S')
                  SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-5)
                  TAG="${TIMESTAMP}-${SHORT_SHA}-staging"
                  echo "TAG=$TAG" >> $GITHUB_OUTPUT
                  echo "Generated Tag: $TAG"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./ui
                  file: ./ui/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:${{ steps.generate_tag.outputs.TAG }}
                      ${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:beta
    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  envs: IMAGE_TAG
                  script: |
                      IMAGE_URI="docker.io/${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:$IMAGE_TAG"
                      podman image prune -f
                      echo "Pulling $IMAGE_URI..."
                      podman pull $IMAGE_URI
                      echo "Gracefully stopping current UI service..."
                      podman stop --time 15 frontend-service || true
                      podman rm frontend-service || true
                      echo "Starting new container..."
                      podman run -d \
                        --name frontend-service \
                        --restart on-failure \
                        -p 9002:80 \
                        $IMAGE_URI
                      echo "Waiting 5 seconds for initialization..."
                      sleep 5
                      if curl -f http://localhost:9002/health; then
                          echo "Deployment Successful: UI Health check passed!"
                          echo "Running disk cleanup to remove the old image..."
                          podman image prune -a -f
                      else
                          echo "Deployment Failed: UI Health check failed!"
                          podman logs frontend-service
                          exit 1
                      fi

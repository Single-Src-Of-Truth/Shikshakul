name: Frontend (Angular) Deployment

on:
    push:
        branches: ["beta"]
        paths:
            - "ui/**"
            - ".github/workflows/frontend-cd.yml"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./ui
                  file: ./ui/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:beta

    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # 1. Cleanup Disk Space
                      podman system prune -a -f --volumes

                      # 2. Pull the new image
                      podman pull docker.io/${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:beta

                      # 3. Stop old container
                      podman stop frontend-service || true
                      podman rm frontend-service || true

                      # 4. Run new container on Port 9002
                      podman run -d \
                        --name frontend-service \
                        --restart on-failure \
                        -p 9002:80 \
                        docker.io/${{ secrets.DOCKER_USERNAME }}/shikshakul-frontend:beta
